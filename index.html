<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuottien tunnistaminen</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.5/build/cjs/vexflow.js" integrity="sha384-hTp5EB4x3B2hpyg2cOUxiLQjsEiWr0zbn6ABKZvaJm4hMThks7+F9ruInnkC3Vse" crossorigin="anonymous"></script>
  </head>
  <body>
    <main class="app">
      <div class="toolbar">
        <div class="theme-picker" id="theme-picker">
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Vaihda teema">
            <span class="swatch" id="theme-swatch"></span>
            <span id="theme-label"></span>
            <span class="chevron">▼</span>
          </button>
          <div class="theme-menu" id="theme-menu" role="listbox"></div>
        </div>
      </div>

      <section class="game">
        <div class="notation-area" id="notation" aria-live="polite"></div>
        <div class="status">
          <div class="status-row">
            <span>Oikein</span>
            <strong id="score">0</strong>
          </div>
          <div class="status-row">
            <span>Väärin</span>
            <strong id="mistakes">0</strong>
          </div>
          <div class="status-row">
            <span>Putki</span>
            <strong id="streak">0</strong>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
