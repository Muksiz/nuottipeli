<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="app.title">Nuottien tunnistaminen</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.5/build/cjs/vexflow.js" integrity="sha384-hTp5EB4x3B2hpyg2cOUxiLQjsEiWr0zbn6ABKZvaJm4hMThks7+F9ruInnkC3Vse" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
      <span class="blob blob-4"></span>
      <span class="blob blob-5"></span>
    </div>
    <div class="notes-layer" aria-hidden="true"></div>
    <main class="app">
      <div class="toolbar">
        <button type="button" class="toolbar-back" id="toolbar-back" hidden>
          <span class="toolbar-back-arrow" aria-hidden="true">←</span>
          <span data-i18n="nav.back">Takaisin</span>
        </button>
        <div class="app-settings" id="app-settings">
          <button
            id="app-settings-toggle"
            class="app-settings-toggle"
            type="button"
            aria-label="Asetukset"
            data-i18n-aria="settings.title"
            aria-expanded="false"
            aria-controls="app-settings-menu"
          >
            <span class="gear" aria-hidden="true">⚙</span>
            <span class="app-settings-text" data-i18n="settings.title">Asetukset</span>
          </button>
          <div class="app-settings-backdrop" id="app-settings-backdrop" hidden></div>
          <div
            class="app-settings-menu"
            id="app-settings-menu"
            role="dialog"
            aria-modal="true"
            aria-label="Asetukset"
            data-i18n-aria="settings.title"
            hidden
          >
            <div class="app-settings-bar">
              <button
                type="button"
                class="app-settings-done"
                id="app-settings-done"
              >
                <span class="toolbar-back-arrow" aria-hidden="true">←</span>
                <span data-i18n="settings.done">Valmis</span>
              </button>
            </div>
            <div class="app-settings-cols">
              <div class="app-settings-group">
                <div
                  class="lang-menu"
                  id="lang-menu"
                  role="listbox"
                  aria-label="Kieli"
                  data-i18n-aria="settings.language"
                ></div>
              </div>
              <div class="app-settings-group">
                <div
                  class="clef-menu"
                  id="clef-menu"
                  role="listbox"
                  aria-label="Nuottiavain"
                  data-i18n-aria="settings.clef"
                ></div>
              </div>
              <div class="app-settings-group">
                <div
                  class="theme-menu"
                  id="theme-menu"
                  role="listbox"
                  aria-label="Teema"
                  data-i18n-aria="settings.theme"
                ></div>
              </div>
            </div>
            <div class="app-settings-group">
              <div
                class="settings-panel"
                id="settings-panel"
                role="group"
                aria-label="Nuottialue"
                data-i18n-aria="settings.ranges"
              >
                <div class="range-rows" id="range-rows"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <section class="screen menu-screen" id="menu-screen">
        <div class="main-menu">
          <section class="menu-group" aria-labelledby="menu-group-notes">
            <h2 class="menu-group-heading" id="menu-group-notes" data-i18n="menu.groupNotes">
              Nuotit
            </h2>
            <button type="button" class="menu-item" id="menu-notes">
              <span class="menu-icon" aria-hidden="true">𝄞</span>
              <span class="menu-text">
                <span class="menu-name" data-i18n="menu.notes">Tunnista nuotit</span>
                <span class="menu-note" data-i18n="menu.notesNote">
                  Nimeä nuotit yksi kerrallaan.
                </span>
              </span>
            </button>
            <button type="button" class="menu-item" id="menu-cards">
              <span class="menu-icon" aria-hidden="true">♬</span>
              <span class="menu-text">
                <span class="menu-name" data-i18n="menu.cards">Nuottikortit</span>
                <span class="menu-note" data-i18n="menu.cardsNote">
                  Selaa nuotteja kortteina ja käännä nimi esiin.
                </span>
              </span>
            </button>
            <button type="button" class="menu-item" id="menu-notechart">
              <span class="menu-icon" aria-hidden="true">♩</span>
              <span class="menu-text">
                <span class="menu-name" data-i18n="menu.noteChart">Nuottitaulukko</span>
                <span class="menu-note" data-i18n="menu.noteChartNote">
                  Kaikki nuotit yhdellä silmäyksellä.
                </span>
              </span>
            </button>
          </section>
          <section class="menu-group" aria-labelledby="menu-group-keys">
            <h2 class="menu-group-heading" id="menu-group-keys" data-i18n="menu.groupKeys">
              Sävellajit
            </h2>
            <button type="button" class="menu-item" id="menu-keys">
              <span class="menu-icon" aria-hidden="true">♯</span>
              <span class="menu-text">
                <span class="menu-name" data-i18n="menu.keys">Tunnista sävellaji</span>
                <span class="menu-note" data-i18n="menu.keysNote">
                  Päättele sävellaji etumerkinnästä.
                </span>
              </span>
            </button>
            <button type="button" class="menu-item" id="menu-keycards">
              <span class="menu-icon" aria-hidden="true">♭</span>
              <span class="menu-text">
                <span class="menu-name" data-i18n="menu.keyCards">Sävellajikortit</span>
                <span class="menu-note" data-i18n="menu.keyCardsNote">
                  Selaa sävellajeja kortteina ja käännä nimi esiin.
                </span>
              </span>
            </button>
            <button type="button" class="menu-item" id="menu-keychart">
              <span class="menu-icon" aria-hidden="true">♮</span>
              <span class="menu-text">
                <span class="menu-name" data-i18n="menu.keyChart">Sävellajitaulukko</span>
                <span class="menu-note" data-i18n="menu.keyChartNote">
                  Kaikki sävellajit yhdellä silmäyksellä.
                </span>
              </span>
            </button>
          </section>
        </div>
      </section>

      <section class="screen setup-screen" id="setup-screen" hidden>
        <h1 class="screen-title" id="setup-title" data-i18n="setup.title">
          Valitse nuottien määrä.
        </h1>
        <div
          class="note-count-options"
          id="note-count-options"
          role="group"
          aria-labelledby="setup-title"
        ></div>
      </section>

      <section class="screen cards-screen" id="cards-screen" hidden>
        <h1 class="screen-title" id="cards-title" data-i18n="cards.title">
          Nuottikortit
        </h1>
        <p class="screen-hint" data-i18n="cards.hint">
          Paina välilyöntiä tai napauta korttia. Kortti vaihtuu itsestään.
        </p>
        <div
          class="card-order"
          id="card-order"
          role="radiogroup"
          aria-label="Korttien järjestys"
          data-i18n-aria="cards.order"
        >
          <button
            type="button"
            class="card-order-btn"
            data-order="deck"
            role="radio"
            aria-checked="true"
            data-i18n="cards.inOrder"
          >
            Järjestyksessä
          </button>
          <button
            type="button"
            class="card-order-btn"
            data-order="random"
            role="radio"
            aria-checked="false"
            data-i18n="cards.random"
          >
            Satunnainen
          </button>
        </div>
        <div class="card-deck">
          <div
            class="note-card-slot"
            id="note-cards"
            role="group"
            aria-labelledby="cards-title"
          ></div>
        </div>
        <p class="deck-position" id="cards-position" aria-live="polite"></p>
      </section>

      <section class="screen game" id="game-screen" hidden>
        <div class="progress" id="progress"></div>
        <div class="notation-area" id="notation" aria-live="polite"></div>
        <div class="status">
          <div class="status-row">
            <span data-i18n="game.correct">Oikein</span>
            <strong id="score">0</strong>
          </div>
          <div class="status-row">
            <span data-i18n="game.wrong">Väärin</span>
            <strong id="mistakes">0</strong>
          </div>
          <div class="status-row">
            <span data-i18n="game.streak">Putki</span>
            <strong id="streak">0</strong>
          </div>
        </div>
        <div
          class="note-pad"
          id="note-pad"
          aria-label="Nuottipainikkeet"
          data-i18n-aria="game.notePad"
        ></div>
      </section>

      <section class="screen chart-screen" id="note-chart-screen" hidden>
        <h1 class="screen-title" id="note-chart-title" data-i18n="menu.noteChart">
          Nuottitaulukko
        </h1>
        <div class="chart-staff-wrap">
          <div class="chart-staff-rows" id="note-chart-rows"></div>
        </div>
      </section>

      <section class="screen chart-screen" id="key-chart-screen" hidden>
        <h1 class="screen-title" id="key-chart-title" data-i18n="menu.keyChart">
          Sävellajitaulukko
        </h1>
        <div class="key-chart" id="key-chart"></div>
      </section>

      <section class="screen game keys-screen" id="keys-screen" hidden>
        <div class="progress" id="keys-progress"></div>
        <div class="notation-area" id="keys-notation" aria-live="polite"></div>
        <p class="keys-prompt" id="keys-prompt" data-i18n="keys.prompt">
          Mikä sävellaji?
        </p>
        <div
          class="key-options"
          id="key-options"
          role="group"
          aria-labelledby="keys-prompt"
        ></div>
        <div class="status">
          <div class="status-row">
            <span data-i18n="game.correct">Oikein</span>
            <strong id="keys-score">0</strong>
          </div>
          <div class="status-row">
            <span data-i18n="game.wrong">Väärin</span>
            <strong id="keys-mistakes">0</strong>
          </div>
          <div class="status-row">
            <span data-i18n="game.streak">Putki</span>
            <strong id="keys-streak">0</strong>
          </div>
        </div>
      </section>

      <section class="screen results-screen" id="results-screen" hidden>
        <h1 class="screen-title" data-i18n="results.title">Peli ohi!</h1>
        <div class="results-face" id="results-face" aria-hidden="true"></div>
        <div class="results-stats" id="results-stats"></div>
        <button
          type="button"
          class="primary-btn"
          id="play-again"
          data-i18n="results.playAgain"
        >
          Pelaa uudelleen
        </button>
        <p class="screen-hint">
          <span data-i18n="results.hintBefore">Paina</span>
          <kbd>Tab</kbd>
          <span data-i18n="results.hintAfter">
            pelataksesi uudelleen samalla nuottimäärällä.
          </span>
        </p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
