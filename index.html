<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="app.title">Nuottien tunnistaminen</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.5/build/cjs/vexflow.js" integrity="sha384-hTp5EB4x3B2hpyg2cOUxiLQjsEiWr0zbn6ABKZvaJm4hMThks7+F9ruInnkC3Vse" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
      <span class="blob blob-4"></span>
      <span class="blob blob-5"></span>
    </div>
    <div class="notes-layer" aria-hidden="true"></div>
    <main class="app">
      <div class="toolbar">
        <div class="app-settings" id="app-settings">
          <button
            id="app-settings-toggle"
            class="app-settings-toggle"
            type="button"
            aria-label="Asetukset"
            data-i18n-aria="settings.title"
            aria-expanded="false"
            aria-controls="app-settings-menu"
          >
            <span class="gear" aria-hidden="true">⚙</span>
            <span class="app-settings-text" data-i18n="settings.title">Asetukset</span>
          </button>
          <div class="app-settings-backdrop" id="app-settings-backdrop" hidden></div>
          <div
            class="app-settings-menu"
            id="app-settings-menu"
            role="dialog"
            aria-modal="true"
            aria-label="Asetukset"
            data-i18n-aria="settings.title"
            hidden
          >
            <div class="app-settings-bar">
              <button
                type="button"
                class="settings-reset"
                id="settings-reset"
                data-i18n="settings.reset"
              >
                Palauta oletukset
              </button>
              <button
                type="button"
                class="app-settings-done"
                id="app-settings-done"
                data-i18n="settings.done"
              >
                Valmis
              </button>
            </div>
            <div class="app-settings-cols">
              <div class="app-settings-group">
                <div
                  class="lang-menu"
                  id="lang-menu"
                  role="listbox"
                  aria-label="Kieli"
                  data-i18n-aria="settings.language"
                ></div>
              </div>
              <div class="app-settings-group">
                <div
                  class="clef-menu"
                  id="clef-menu"
                  role="listbox"
                  aria-label="Nuottiavain"
                  data-i18n-aria="settings.clef"
                ></div>
              </div>
              <div class="app-settings-group">
                <div
                  class="theme-menu"
                  id="theme-menu"
                  role="listbox"
                  aria-label="Teema"
                  data-i18n-aria="settings.theme"
                ></div>
              </div>
            </div>
            <div class="app-settings-group">
              <div
                class="settings-panel"
                id="settings-panel"
                role="group"
                aria-label="Nuottialueet"
                data-i18n-aria="settings.ranges"
              >
                <div class="range-rows" id="range-rows"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <section class="screen setup-screen" id="setup-screen">
        <h1 class="screen-title" data-i18n="setup.title">
          Valitse vaikeustaso ja nuottien määrä.
        </h1>
        <div class="setup-group">
          <p class="setup-label" id="difficulty-label" data-i18n="setup.difficulty">
            Vaikeustaso
          </p>
          <div
            class="difficulty-options"
            id="difficulty-options"
            role="group"
            aria-labelledby="difficulty-label"
          ></div>
        </div>
        <div class="setup-group">
          <p class="setup-label" id="note-count-label" data-i18n="setup.noteCount">
            Nuottien määrä
          </p>
          <div
            class="note-count-options"
            id="note-count-options"
            role="group"
            aria-labelledby="note-count-label"
          ></div>
        </div>
      </section>

      <section class="screen game" id="game-screen" hidden>
        <div class="progress" id="progress"></div>
        <div class="notation-area" id="notation" aria-live="polite"></div>
        <div class="status">
          <div class="status-row">
            <span data-i18n="game.correct">Oikein</span>
            <strong id="score">0</strong>
          </div>
          <div class="status-row">
            <span data-i18n="game.wrong">Väärin</span>
            <strong id="mistakes">0</strong>
          </div>
          <div class="status-row">
            <span data-i18n="game.streak">Putki</span>
            <strong id="streak">0</strong>
          </div>
        </div>
        <div
          class="note-pad"
          id="note-pad"
          aria-label="Nuottipainikkeet"
          data-i18n-aria="game.notePad"
        ></div>
      </section>

      <section class="screen results-screen" id="results-screen" hidden>
        <h1 class="screen-title" data-i18n="results.title">Peli ohi!</h1>
        <div class="results-face" id="results-face" aria-hidden="true"></div>
        <div class="results-stats" id="results-stats"></div>
        <button
          type="button"
          class="primary-btn"
          id="play-again"
          data-i18n="results.playAgain"
        >
          Pelaa uudelleen
        </button>
        <p class="screen-hint">
          <span data-i18n="results.hintBefore">Paina</span>
          <kbd>Tab</kbd>
          <span data-i18n="results.hintAfter">
            pelataksesi uudelleen samalla nuottimäärällä.
          </span>
        </p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
