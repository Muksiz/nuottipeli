<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuottien tunnistaminen</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.5/build/cjs/vexflow.js" integrity="sha384-hTp5EB4x3B2hpyg2cOUxiLQjsEiWr0zbn6ABKZvaJm4hMThks7+F9ruInnkC3Vse" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
      <span class="blob blob-4"></span>
      <span class="blob blob-5"></span>
    </div>
    <div class="notes-layer" aria-hidden="true"></div>
    <main class="app">
      <div class="toolbar">
        <div class="app-settings" id="app-settings">
          <button
            id="app-settings-toggle"
            class="app-settings-toggle"
            type="button"
            aria-label="Asetukset"
            aria-expanded="false"
            aria-controls="app-settings-menu"
          >
            <span class="gear" aria-hidden="true">⚙</span>
            <span class="app-settings-text">Asetukset</span>
          </button>
          <div class="app-settings-backdrop" id="app-settings-backdrop" hidden></div>
          <div
            class="app-settings-menu"
            id="app-settings-menu"
            role="dialog"
            aria-modal="true"
            aria-label="Asetukset"
            hidden
          >
            <div class="app-settings-cols">
              <div class="app-settings-group">
                <p class="app-settings-heading">Nuottiavain</p>
                <div class="clef-menu" id="clef-menu" role="listbox"></div>
              </div>
              <div class="app-settings-group">
                <p class="app-settings-heading">Teema</p>
                <div class="theme-menu" id="theme-menu" role="listbox"></div>
              </div>
            </div>
            <div class="app-settings-group">
              <p class="app-settings-heading">Nuottialueet</p>
              <div class="settings-panel" id="settings-panel">
                <p class="settings-note" id="settings-clef-note"></p>
                <div class="range-rows" id="range-rows"></div>
                <button type="button" class="settings-reset" id="settings-reset">
                  Palauta oletukset
                </button>
              </div>
            </div>
            <button type="button" class="app-settings-done" id="app-settings-done">
              Valmis
            </button>
          </div>
        </div>
      </div>

      <section class="screen setup-screen" id="setup-screen">
        <h1 class="screen-title">Valitse vaikeustaso ja nuottien määrä.</h1>
        <div class="setup-group">
          <p class="setup-label" id="difficulty-label">Vaikeustaso</p>
          <div
            class="difficulty-options"
            id="difficulty-options"
            role="group"
            aria-labelledby="difficulty-label"
          ></div>
        </div>
        <div class="setup-group">
          <p class="setup-label" id="note-count-label">Nuottien määrä</p>
          <div
            class="note-count-options"
            id="note-count-options"
            role="group"
            aria-labelledby="note-count-label"
          ></div>
        </div>
      </section>

      <section class="screen game" id="game-screen" hidden>
        <div class="progress" id="progress"></div>
        <div class="notation-area" id="notation" aria-live="polite"></div>
        <div class="status">
          <div class="status-row">
            <span>Oikein</span>
            <strong id="score">0</strong>
          </div>
          <div class="status-row">
            <span>Väärin</span>
            <strong id="mistakes">0</strong>
          </div>
          <div class="status-row">
            <span>Putki</span>
            <strong id="streak">0</strong>
          </div>
        </div>
        <div class="note-pad" id="note-pad" aria-label="Nuottipainikkeet"></div>
      </section>

      <section class="screen results-screen" id="results-screen" hidden>
        <h1 class="screen-title">Peli ohi!</h1>
        <div class="results-face" id="results-face" aria-hidden="true"></div>
        <div class="results-stats" id="results-stats"></div>
        <button type="button" class="primary-btn" id="play-again">Pelaa uudelleen</button>
        <p class="screen-hint">Paina <kbd>Tab</kbd> pelataksesi uudelleen samalla nuottimäärällä.</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
